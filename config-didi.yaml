# 目標視窗的標題片段；程式會選擇第一個符合的可見視窗。
target_window_title: "SpiritVale"

capture:
  # printwindow 可嘗試截取未在前景的視窗。
  method: mss
  # PrintWindow 失敗時，是否改抓桌面上同位置的區域。
  fallback_to_desktop: true

# Change only active_map to switch teleport destination, lock-target templates,
# and the WASD movement script for a combat map. HSV health-bar detection stays global.
active_map: goblin_warcamp

maps:
  demon_mouth:
    # Omitted resource paths use assets/maps/demon_mouth/<default filename>.
    target_template_paths: []
    movement_script_path: null
    arrival_minimap_template_path: null
  night_garden:
    arrival_minimap_threshold: 0.70
    route_start_delay_ms: 1000
  the_forge:
    arrival_minimap_threshold: 0.70
    # Detect the arrival minimap first, then wait this long before replaying WASD.
    route_start_delay_ms: 2000
  goblin_warcamp:
    arrival_minimap_threshold: 0.70
    route_start_delay_ms: 1000
  starfall_tundra:
    arrival_minimap_threshold: 0.70
    route_start_delay_ms: 1000
  sunken_depths:
    arrival_minimap_threshold: 0.70
    route_start_delay_ms: 1000

detection:
  # 任一範本辨識成功都會觸發相同的任務 1（按 3）。
  template_paths:
    []
  # 反例出現時不觸發任務 1，即使正例同時被辨識到。
  negative_template_paths: []
  # 介於 0 到 1；越高越嚴格。
  threshold: 0.85
  # 只在指定區域尋找，可縮短處理時間。null 表示整個視窗。
  # roi: [left, top, width, height]
  roi: null
  # 任務 1 的 HSV 與範本只在視窗中心附近搜尋，降低四周相似物件的誤判。
  center_roi:
    enabled: true
    width: 1000
    height: 800
    offset_y: 0

hsv_bar:
  enabled: true
  min_width: 60
  max_width: 160
  min_height: 8
  max_height: 35
  # 實際目標黑框約為 91 x 25 px（長寬比 3.6），保留些許縮放餘裕。
  min_aspect_ratio: 3.0
  max_aspect_ratio: 12.0
  max_white_ratio: 0.80
  min_horizontal_run_ratio: 0.50
  min_allowed_colour_ratio: 0.60
  edge_band_px: 2
  edge_black_ratio: 0.50
  inner_band_enabled: true
  black_residual_enabled: true
  black_residual:
    min_extent: 0.75
    dedup_iou: 0.30
    outer_ring_px: 3
    min_outer_contrast: 8.0
    low_colour_trigger_ratio: 0.40

action:
  # 常用值：SPACE、ENTER、ESC、LEFT、RIGHT、UP、DOWN、A-Z、0-9。
  key: "3"
  # 先以乾跑模式驗證，不會發送按鍵。
  dry_run: false
  # 模擬 AutoHotkey 的 Send("3")：立即放開，再由重複週期決定下一次按鍵。
  key_hold_ms: 0
  # 圖案持續存在時，每隔多久再送出一次按鍵。
  repeat_interval_ms: 20
  # 同一技能組兩次施放的最小間隔。
  skill_interval_ms: 20
  skills:
    - {key: "3", cooldown_ms: 20}

pointer:
  # 游標移到圖案中心後的垂直偏移量；-50 表示圖案上方 50 像素。
  offset_y: -50

# 斷線後出現登入畫面時，先依序選伺服器／角色再進入遊戲。
# 若換帳號或角色，請替換對應的名稱裁圖並調整 name 與 template_path。
login_recovery:
  enabled: true
  threshold: 0.82
  action_delay_ms: 700
  server:
    name: "SEA"
    template_path: assets/login/server/sea.png
    connect_template_path: assets/login/server/connect.png
  character:
    name: "滴滴殺手"
    template_path: assets/login/character/didi_killer.png
    play_template_path: assets/login/character/play.png

disconnect_recovery:
  enabled: true
  threshold: 0.82
  confirm_template_path: assets/disconnect/confirm.png

# 主城時使用傳送石前往指定地圖。每一步都必須先識別到對應圖示才會操作。
town_teleport:
  enabled: true
  threshold: 0.75
  action_delay_ms: 700
  stage_timeout_ms: 8000
  town_minimap_template_path: assets/teleport/city_minimap.png
  # 2560x1440 遊戲視窗的右上角小地圖範圍；限制搜尋以維持偵測效能。
  town_minimap_roi: [2200, 0, 360, 410]
  consumables_template_path: assets/teleport/consumables.png
  waystone_template_path: assets/teleport/waystone.png
  waystone_confirm_template_path: assets/teleport/waystone_confirm.png
  waystone_confirm_template_paths:
    - assets/teleport/waystone_confirm.png
    - assets/teleport/waystone_confirm2.png
  teleport_confirm_template_path: assets/teleport/teleport_confirm.png

# 正規化小地圖倍率；游標會移至小地圖中央後送出 Ctrl+滾輪。
minimap_zoom:
  enabled: false
  # 主城：滾輪向下 30 次，再開始傳送。
  town_scroll_steps: 30
  # 戰鬥地圖：滾輪向上 30 次，再開始錄製路線。
  combat_scroll_steps: 30
  # 離開主城後先等待地圖與小地圖載入完成，再開始縮放。
  combat_load_wait_ms: 5000
  interval_ms: 10

# 偵測到目標、開始一場新戰鬥時，依序各施放一次技能。
combat_start:
  enabled: true
  # 死亡、斷線回復或傳送石後，確認左上角狀態圖示前的技能組。
  skill_interval_ms: 330
  # 整組技能放完後，等待多久才再次檢查狀態圖示並決定是否重放。
  verify_delay_ms: 500
  status_template_path: assets/combat/combat_state_icon.png
  status_threshold: 0.65
  # [left, top, width, height]：左上角狀態圖示區域。
  status_roi: [0, 0, 500, 350]
  skills:
    - key: "4"

# 死亡視窗優先於登入、傳送、戰鬥與走路；只點一次後等待視窗消失。
death_recovery:
  enabled: true
  threshold: 0.82
  town_respawn_template_path: assets/death/town_respawn.png
  healer_enabled: true
  healer_template_path: assets/death/healer.png
  healer_dialog_template_path: assets/death/healer_dialog.png
  healer_threshold: 0.80

# 中心目標在全螢幕中心半徑內時，先立即按 2，再每 2 秒重複一次。
center_target:
  enabled: false
  template_paths:
    - assets/center_target
  radius_px: 350
  key: "2"
  key_hold_ms: 0
  repeat_interval_ms: 500
  skill_interval_ms: 500
  skills:
    - {key: "2", cooldown_ms: 500}

crowd_combat:
  enabled: true
  # false 時仍施放群怪技能，但走路不再避開怪群方向。
  avoid_movement_enabled: true
  keys: ["2","F1", "F2", "F3", "F4","F5","F6"]
  min_targets: 2
  skill_cooldown_ms: 6000
  skill_interval_ms: 330
  skills:
    - {key: "2", cooldown_ms: 2000}
    - {key: "F1", cooldown_ms: 5000}
    - {key: "F2", cooldown_ms: 6000}
    - {key: "F3", cooldown_ms: 6000}
    - {key: "F4", cooldown_ms: 2000}
    - {key: "R", cooldown_ms: 5000}

walking:
  enabled: true
  # 可選模式：
  # - random：保留原本安全範圍內的隨機走路，使用 step_distance、speed_px_per_sec、boundary_x、boundary_y。
  # - route：依 route.waypoints 的 A/B/C 等手動座標走動，可選用 route.map_recording 進行定位。
  # - scripted_route：主城傳送完成後，依 active_map.movement_script_path 重播錄製的 WASD 時間片段。
  mode: scripted_route
  step_distance: 50
  speed_px_per_sec: 100
  boundary_x: 200  # 左右各最多 60 px
  boundary_y: 200   # 上下各最多 40 px
  route:
    # 以遊戲視窗右上角為基準；不同解析度仍會自動靠右。
    minimap: {right_px: 20, top_px: 20, width_px: 340, height_px: 360}
    white_threshold: 220
    pair_max_distance_px: 18
    arrival_radius_px: 12
    movement_deadzone_px: 4
    map_recording:
      enabled: false
      manifest_path: maps/latest/manifest.yaml
      min_match_count: 8
      max_position_jump_px: 80
    # 依你標示的 A、B、C 初始位置；導航會選最近點但不立即回上一站。
    waypoints:
      - {name: A, x: 180, y: 150}
      - {name: B, x: 220, y: 180}
      - {name: C, x: 185, y: 210}
skill_queue:
  enabled: true
  queue_interval_ms: 330
  schedules:
    - {key: "2", interval_seconds: 5}
    - {key: "6", interval_seconds: 45}
    - {key: "5", interval_seconds: 19}
    - {key: "6", interval_seconds: 20}
    - {key: "7", interval_seconds: 10}
    - {key: "V", interval_seconds: 0.75}

runtime:
  # 與任務 1 的獨立冷卻同步，每 20 ms 重新確認圖案是否仍存在。
  poll_interval_ms: 20
  detection_timing_log_interval_ms: 5000
  #  off, events
  log_mode: off
  save_debug_frame: false
  debug_frame_path: debug/latest_detection.png
